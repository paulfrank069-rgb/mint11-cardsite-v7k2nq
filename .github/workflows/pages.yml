name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack site
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -f pages/index.html ]; then
            cp -a pages/. _site/
          elif [ -d chunks ]; then
            cat $(ls chunks/chunk-*.txt | sort) | base64 -d > /tmp/site.tar.gz
            tar -xzf /tmp/site.tar.gz -C _site
          else
            echo "No pages/ or chunks/ payload found" >&2
            exit 1
          fi
          touch _site/.nojekyll
          test -f _site/index.html
          test -d _site/images
          ls -la _site | head
          ls _site/images | wc -l

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
