name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack site
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -f pages/index.html ]; then
            cp -a pages/. _site/
          elif [ -d chunks ]; then
            n=$(awk -F= '/^chunks=/{print $2}' chunks/MANIFEST.txt)
            if [ -z "${n}" ]; then
              echo "chunks/MANIFEST.txt missing chunks= count" >&2
              exit 1
            fi
            files=$(seq -f "chunks/chunk-%02g.txt" 0 $((n-1)))
            for f in $files; do
              test -f "$f" || { echo "missing $f" >&2; exit 1; }
            done
            cat $files | base64 -d > /tmp/site.tar.gz
            tar -xzf /tmp/site.tar.gz -C _site
          else
            echo "No pages/ or chunks/ payload found" >&2
            exit 1
          fi
          touch _site/.nojekyll
          test -f _site/index.html
          test -d _site/images
          echo "Unpacked images: $(ls _site/images | wc -l)"

      - name: Publish unpacked site to published branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a _site /tmp/_site
          git checkout --orphan published-tmp
          git rm -rf --quiet . || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/_site/. .
          git add -A
          git commit -m "Publish unpacked site"
          git branch -M published
          git push -f origin published
