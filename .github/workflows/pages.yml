name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack site
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -f pages/index.html ]; then
            cp -a pages/. _site/
          elif [ -d chunks ]; then
            cat $(ls chunks/chunk-*.txt | sort) | base64 -d > /tmp/site.tar.gz
            tar -xzf /tmp/site.tar.gz -C _site
          else
            echo "No pages/ or chunks/ payload found" >&2
            exit 1
          fi
          touch _site/.nojekyll
          test -f _site/index.html
          test -d _site/images
          echo "Unpacked images: $(ls _site/images | wc -l)"

      - name: Publish unpacked site to published branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a _site /tmp/_site
          git checkout --orphan published-tmp
          git rm -rf --quiet . || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/_site/. .
          git add -A
          git commit -m "Publish unpacked site"
          git branch -M published
          git push -f origin published

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
