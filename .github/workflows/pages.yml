name: Publish site

on:
  push:
    branches: [era-filter-1127]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    # Publish only from era-filter-1127 (push or manual run on that branch).
    if: github.ref == 'refs/heads/era-filter-1127'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack site
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -f pages/index.html ]; then
            cp -a pages/. _site/
          elif [ -d chunks ]; then
            cat $(ls chunks/chunk-*.txt | sort -V) | base64 -d > /tmp/site.tar.gz
            tar -xzf /tmp/site.tar.gz -C _site
          else
            echo "No pages/ or chunks/ payload found" >&2
            exit 1
          fi
          touch _site/.nojekyll
          test -f _site/index.html
          test -d _site/images
          echo "Unpacked images: $(ls _site/images | wc -l)"

      - name: Add Money page
        run: |
          set -euo pipefail
          # Password-protected page + encrypted data (never plaintext).
          mkdir -p _site/money _site/data
          cp -a money/. _site/money/
          cp data/money.enc.json _site/data/money.enc.json
          test -f _site/money/index.html
          # Older packed builds have no site nav; add the Money link if missing.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("_site/index.html")
          s = p.read_text(encoding="utf-8")
          if 'href="money/"' not in s:
              css = (".site-nav{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 .8rem}"
                     ".site-nav a{display:inline-flex;align-items:center;min-height:40px;padding:.3rem .9rem;"
                     "border-radius:999px;border:1px solid var(--champagne);background:var(--panel);"
                     "text-decoration:none;font-weight:600;font-size:.92rem}"
                     ".site-nav a[aria-current=page]{background:var(--ink);color:var(--cream);border-color:var(--ink)}")
              nav = ('<header class="site-header">\n      <nav class="site-nav" aria-label="Site">'
                     '<a href="./" aria-current="page">Cards</a> <a href="money/">Money</a></nav>')
              assert '<header class="site-header">' in s and "</style>" in s
              s = s.replace("</style>", css + "</style>", 1).replace('<header class="site-header">', nav, 1)
              p.write_text(s, encoding="utf-8")
              print("Injected Money nav link")
          PY

      - name: Publish unpacked site to published branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a _site /tmp/_site
          git checkout --orphan published-tmp
          git rm -rf --quiet . || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/_site/. .
          git add -A
          git commit -m "Publish unpacked site"
          git branch -M published
          git push -f origin published
